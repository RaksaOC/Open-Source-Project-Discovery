# Project settings. Values marked TBD are decided once we look at the data.

# One seed for everything random: sampling repositories, choosing the development
# queries, picking rows to check by hand. Read it with discovery.config.SEED.
seed: 42

paths:
  raw: data/raw                 # API responses as JSON lines
  processed: data/processed     # cleaned corpus (parquet)
  index: data/index             # inverted index, TF-IDF matrix, FAISS index, graph
  eval: eval

collection:
  target_size: 10000            # repositories in the corpus
  min_stars: 5                  # TBD: low enough to keep small beginner projects
  require_readme: true
  english_only: true
  per_query_cap: 1000           # GitHub search returns at most 1,000 results per query
  # Where the search looks. GitHub's default is name, description and topics only; most projects
  # name their framework only in the README (Phase 2: 36 vs 219 for "inventory management" django).
  search_in: [name, description, topics, readme]
  search_gap_s: 2.1             # one search every 2.1 s (limit 30 per minute)
  core_gap_s: 0.75              # one core request every 0.75 s (limit 5,000 per hour = one per 0.72 s)
  contributors_limit: 30        # top contributors kept per repository (for the graph)
  # The search API caps results, so we slice the corpus into many small queries:
  # (application domain) x (framework or language), split further by star range if needed.
  domains:
    - inventory management
    - point of sale
    - e-commerce
    - blog
    - chat application
    - todo
    - school management
    - hospital management
    - library management
    - booking system
    - crm
    - portfolio
  frameworks:
    - nestjs
    - express
    - django
    - flask
    - fastapi
    - laravel
    - spring-boot
    - rails
    - react
    - vue
    - nextjs
    - flutter
  # ~10% of the corpus comes from unrelated searches (same filters, no framework), so queries
  # have clear non-relevant results to push down. Pick topics that overlap none of the domains.
  other_share: 0.10
  other_topics:
    - game
    - weather app
    - music player
    - calculator
    - url shortener
    - markdown editor
    - password manager
    - image editor
    - file manager
    - compiler

preprocessing:
  readme_max_chars: 20000       # keep the first 20,000 characters of each cleaned README
  english_min_stopword_share: 0.05   # below this share of English stop words, a README is not English
  english_min_words: 30         # shorter texts are always kept ("A POS app." fails any stop-word test)
  keep_terms: technologies.yaml # tech names are never stemmed or split ("node.js", "c#")

ranking:
  default_method: bm25          # boolean | tfidf | bm25 | embedding | hybrid
  bm25: {k1: 1.5, b: 0.75}      # TBD: tune on the evaluation queries
  embedding_model: sentence-transformers/all-MiniLM-L6-v2   # TBD
  hybrid_alpha: 0.5             # weight of BM25 vs embeddings, TBD

popularity:
  # final score = relevance_weight * relevance + (1 - relevance_weight) * popularity
  relevance_weight: 0.8         # TBD
  weights: {stars: 0.4, forks: 0.2, pagerank: 0.4}   # TBD
  graph_edges: [shared_contributor, shared_topic, fork_of, readme_link]   # TBD

evaluation:
  num_queries: 25
  pool_depth: 10                # top-k from every method goes to the labelling pool
  relevance_scale: {0: not relevant, 1: partly relevant, 2: relevant}
  cutoffs: [5, 10]
